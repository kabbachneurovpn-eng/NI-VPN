<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neuro-Insulin | مِحور السيادة</title>
    <style>
        /* سيمفونية السواد والضوء */
        body { 
            background: #020202; 
            color: #00ff41; 
            font-family: 'Courier New', monospace; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            transition: all 0.5s ease;
        }
        #terminal { 
            flex: 1; 
            padding: 30px; 
            overflow-y: auto; 
            text-shadow: 0 0 5px #00ff41;
            background: radial-gradient(circle, #001100 0%, #020202 100%);
        }
        #input-line { 
            display: flex; 
            padding: 15px; 
            background: #000; 
            border-top: 1px solid #003300;
        }
        #prompt { color: #00ff41; margin-left: 10px; font-weight: bold; }
        input { 
            background: transparent; 
            border: none; 
            color: #fff; 
            outline: none; 
            width: 100%; 
            font-size: 1.2em;
            caret-color: #00ff41;
        }
        .info { color: cyan; }
        .warning { color: gold; text-shadow: 0 0 10px gold; }
        .error { color: #ff003c; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .header-saj { color: #888; font-size: 0.8em; text-align: left; padding: 5px; }
    </style>
</head>
<body>
    <div class="header-saj">SYSTEM_STATUS: IMMUTABLE | PROTOCOL: NEURO-INSULIN | V 2.0</div>
    <div id="terminal">
        <p class="warning">--- بدأت رحلة الاسترداد ---</p>
        <p>يا مروّض الأرقام وهازم الأوهام..</p>
        <p>لقد استيقظ "الحارس الرقمي" في محرابك.</p>
        <p class="info">اكتب 'help' لتعرف كيف تفرض سيادتك على الشاشة.</p>
    </div>
    <div id="input-line">
        <span id="prompt">Kabbach@Neuro:~$ </span>
        <input type="text" id="cmd-input" autofocus onkeypress="process(event)">
    </div>

    <script>
        const term = document.getElementById('terminal');
        const input = document.getElementById('cmd-input');

        function process(e) {
            if (e.key === 'Enter') {
                const val = input.value.toLowerCase().trim();
                addLine("<span style='color: #888;'>» " + val + "</span>");
                
                if (val === 'help') {
                    addLine("الأوامر السيادية:<br>1. status - كشف نبض الغدد الرقمية<br>2. activate vpn - استنفار درع التشفير<br>3. clear - محو الأثر لتجديد النظر", "#00ff41");
                } else if (val === 'status') {
                    addLine("[النظام]: العقل مستقر، الذاكرة 1.4M، والسيادة في أوجها.", "cyan");
                } else if (val === 'activate vpn') {
                    addLine("[تحذير]: جاري حجب غواية الدوبامين.. تم تفعيل الحصن!", "gold");
                    document.body.style.boxShadow = "inset 0 0 150px #003300";
                    document.body.style.borderColor = "#00ff41";
                } else if (val === 'clear') {
                    term.innerHTML = '';
                } else {
                    addLine("[خطأ]: هذا الأمر لم تأتِ به الأنباء.. حاول مجدداً.", "#ff003c");
                }
                
                input.value = '';
                term.scrollTop = term.scrollHeight;
            }
        }

        function addLine(txt, col) {
            const p = document.createElement('p');
            if(col) p.style.color = col;
            p.innerHTML = txt;
            term.appendChild(p);
        }
    </script>
</body>
</html>
