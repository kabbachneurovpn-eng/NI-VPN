<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neuro-Insulin VPN | السيادة الرقمية</title>
    <style>
        body { margin: 0; background: black; color: #00FF41; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; z-index: -1; }
        .content { position: relative; z-index: 1; text-align: center; padding-top: 10%; text-shadow: 0 0 10px #00FF41; }
        h1 { font-size: 3rem; border: 2px solid #00FF41; display: inline-block; padding: 20px; }
        p { font-size: 1.5rem; background: rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="content">
        <h1>Neuro-Insulin VPN</h1>
        <p>مرحباً بك في عصر "السيادة الرقمية"</p>
        <p>"أرض الكلاي زائلة.. والعقار الرقمي هو البقاء"</p>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00FF41";
            ctx.font = fontSize + "px arial";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        function random() { return Math.random(); }
        setInterval(draw, 33);
    </script>
</body>
</html>
