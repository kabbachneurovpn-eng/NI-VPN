<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-Insulin | بوابة السيادة</title>
    <style>
        body { margin: 0; background: #000; font-family: 'Courier New', monospace; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .gate-container { border: 2px solid #00ff41; padding: 50px; text-align: center; box-shadow: 0 0 20px #00ff41; }
        h1 { color: #00ff41; text-shadow: 0 0 5px #00ff41; }
        p { color: #fff; margin-bottom: 30px; }
        .btn-gate { background: transparent; border: 1px solid #00ff41; color: #00ff41; padding: 10px 25px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn-gate:hover { background: #00ff41; color: #000; box-shadow: 0 0 15px #00ff41; }
        #status-message { margin-top: 20px; color: #00ff41; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="gate-container" id="gateway">
        <h1>[ بوابة السيادة الرقمية ]</h1>
        <p>هذا النطاق مجاني ومحمي بنظام Neuro-Insulin</p>
        <p>هل دخولك الآن نابع عن سيادة أم عن تشتت؟</p>
        <button class="btn-gate" onclick="activateSovereignty()">دخـول بوعـي</button>
        <div id="status-message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
