
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-Insulin VPN | السيادة الرقمية</title>
    <style>
        /* تنسيقات عامة */
        body {
            background-color: #0a0a0a; /* أسود عميق */
            color: #00ff41; /* أخضر مصفوفة (Matrix) */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* حاوية المحتوى */
        .container {
            text-align: center;
            padding: 20px;
            border: 1px solid #00ff41;
            box-shadow: 0 0 15px #00ff41;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px #00ff41;
        }

        p {
            color: #00d1ff; /* أزرق تقني */
            font-size: 1.2rem;
            line-height: 1.6;
        }

        /* زر الإجراء */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 30px;
            color: #000;
            background-color: #00ff41;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #00d1ff;
            box-shadow: 0 0 20px #00d1ff;
        }

        /* تأثير تقني بسيط */
        .scan-line {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 65, 0.2);
            position: absolute;
            top: 0;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    
    <div class="container">
        <h1>Neuro-Insulin VPN</h1>
        <p>نظام متطور للتحكم في التركيز وحماية الخصوصية الرقمية.</p>
        <p>مرحباً بك في عصر السيادة الرقمية الجديد.</p>
        
        <div style="margin-top: 30px;">
            <a href="#" class="btn">ابدأ الاتصال الآمن</a>
        </div>
    </div>

    <footer style="margin-top: 20px; font-size: 0.8rem; color: #555;">
        &copy; 2026 جميع الحقوق محفوظة لمشروع Neuro-Insulin
    </footer>
</body>
</html>
